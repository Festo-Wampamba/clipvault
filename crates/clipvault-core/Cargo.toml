[package]
name = "clipvault-core"
version = "0.0.0"
description = "Clip storage, search and retention for ClipVault (no OS code)"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
