[package]
name = "clipvault-capture"
version = "0.0.0"
description = "Clipboard capture and paste-back backends for ClipVault"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "net", "pipe", "process", "std"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["xfixes", "xtest"] }
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io", "p2p"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27.0"
wayland-protocols = { version = "0.32.13", features = ["client", "server", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client", "server"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client", "server"] }
wayland-server = "0.31.14"

[target."cfg(windows)".dependencies]
clipboard-win = { version = "5.4.3", features = ["monitor", "std"] }
image = { version = "0.25.9", default-features = false, features = ["png", "bmp"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
