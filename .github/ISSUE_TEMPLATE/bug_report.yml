name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not paste real clipboard contents** that may contain secrets.
        Security issues go to the [private advisory form](https://github.com/Festo-Wampamba/clipvault/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy an image from Firefox
        2. Open ClipVault with Ctrl+`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - GNOME (Wayland)
        - KDE Plasma (Wayland)
        - Sway / other wlroots
        - Hyprland
        - X11 / Xorg session
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ClipVault version, OS or distribution version, desktop version
      placeholder: "ClipVault 0.1.0, Ubuntu 24.04, GNOME 46"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `clipvault --verbose` if available. Remove anything private.
      render: text
